services:
  mock-chatbot-server:
    build:
      context: ./mock-chatbot-server
    container_name: mock-chatbot-server
    ports:
      - "50052:50052"

  chat-service:
    build:
      context: ./chat-service
    container_name: chat-service
    environment:
      GRPC_SERVER_ADDRESS: mock-chatbot-server:50052
    ports:
      - "8080:8080"
    depends_on:
      - mock-chatbot-server
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  k6:
    image: grafana/k6:0.53.0
    profiles:
      - test
    environment:
      CHAT_WS_URL: ws://chat-service:8080/chat
    volumes:
      - ./experiments/k6:/scripts
    depends_on:
      chat-service:
        condition: service_healthy
    entrypoint: ["k6"]
